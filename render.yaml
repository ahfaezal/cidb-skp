services:
  - type: web
    name: cidb-skp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cidb-skp-db
          property: connectionString

databases:
  - name: cidb-skp-db
    plan: free
    databaseName: skp_cidb
